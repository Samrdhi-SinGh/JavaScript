<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advance funcion</title>
</head>

<body>

  <button onclick="" class="js-click-button">Click</button>

  <script>

    // addEventListener() lets us run some code when we interact with the element.

    //We pass two things in it, 
    //1. Event to be passed.
    //2. Passing a function into another function.
    const buttonElement = document.querySelector('.js-click-button');


    //Best is to always use addevenlistner() instead of onclick.
    const eventListener = () => {
      console.log('click');
    };

    buttonElement.addEventListener('click', eventListener);


    // We can remove EventListner using removeEventListener();
    buttonElement.removeEventListener('click', eventListener);

    //Can have multiple ventListners for an event.

    buttonElement.addEventListener('click', ()=>{
      console.log('click2');
    });


    //Thew first syntax gives us two reasons to use it:
    // 1. It's easier to read.
    // 2. Hoisting: We call the function before its even declared or initialized.

    function functions() { //It's the shortcut for var we dont use anymore.
      console.log('Simple funtion');
    }

    const varb = function () {
      console.log('Function inside variable');
    }

    console.log(varb); //it will print what is inside variable.

    varb();//Variable can also work as function so the function name is not imp when inside a variable.


    // This is Anonymous function. A function without name.

    const funct = function () {
      console.log('variable');
    }

    funct();// Work as a function.
    console.log(typeof funct);//function

    //We can assign function in object. Passing the function:

    const object = {
      num: 1,
      fun: function () {
        console.log('Object function');
      }
    }

    object.fun(); //Object function 


    //Like we pass parameters into functins, we can pass function into functions too:

    function display(param) {
      console.log(param);// (){ console.log("Hello");}
      param();//Hello
    }

    display(function () {
      console.log("Hello");
    });//Callback


    //setTimeout(): A function we want to run in the future, How long to wait before running this function.
    //A number in millisecond is taken. 1000 mlsec = 1 sec

    setTimeout(function () {
      console.log("hello");
    }, 5000); // An asynchronous code it is. Asynchronous code wont wait for a line to finidh before going to the next line.


    //Synchronous code: Will wait for one line to finish before going to the next line.

    setTimeout(function () {
      console.log("Hey");
      console.log("Wooh");
    }, 3000) // Advantage: It doesn't block our code for 3 seconds.


    setInterval(function () {
      console.log("We must roll");
    }, 3000);// setInterval will keep running the function every 3 seconds. It will keep running a function in the future.


    [
      'make dinner',
      'wash basin',
      'give water'
    ].forEach((value, index) => {
      console.log(index);
      console.log(value);//.forEach() is the preferred wy to loop through an array.
    });

    //continue; doesnt work for srray so we use 'return' instead:

    [
      'make dinner',
      'wash basin',
      'give water'
    ].forEach(function (value, index) {

      if (value === 'wash basin') {
        return;
      }
      console.log(index);
      console.log(value);
    });

    //for break; we need to crash the loop. It's the only solution.

    //A shorter way to write functions is 'Arrow function: Passing a function into another function, => use arrow function.

    const hey = (param) => {
      console.log('oye');
      return 5;
    }

    hey();

    //Some arrow function shortcut properties:
    const oneLine = (param) => {
      console.log(param + 1);
    }
    oneLine(2);

    //If there is only one parameter, we can remove the parnthesis and if only one line in body then we can remove curly brackets.

    const noBrackets = () => 2 + 3;
    console.log(noBrackets());


    const obj = {//In object, normal function method is more easy to use then arrow function.
      method: () => {

      },
      method(){

      }
    };

  </script>
</body>

</html>
