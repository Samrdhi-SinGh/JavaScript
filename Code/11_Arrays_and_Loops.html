    // Accumulater Pattern:-
    const nums = [1, 1, 3];//To add all elements inside the array:-
    let total = 0; //Accumulator variable

    for (let i = 0; i < nums.length; i++) {
      total = total + nums[i];
    }
      console.log(total);

    //To double all the elements of an array:-
    const theArray = [];
    for(let i = 0; i < nums.length; i++){
      const num = nums[i];
      theArray.push(num*2);
    }
    console.log(theArray);//(3) [2, 2, 6]
