    function doubleArray(nums) {
      const numDouble = [];

      for (let i = 0; i < nums.length; i++) {
        const num = nums[i];
        if (num === 0) {
          return numDouble;
        }
        numDouble.push(num * 2);
      }
      return numDouble;
    }
